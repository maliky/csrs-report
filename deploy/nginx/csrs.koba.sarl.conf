server {
    server_name csrs.koba.sarl;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 54.36.60.51:443 ssl;
    listen [2001:41d0:303:4233::1]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/csrs.koba.sarl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csrs.koba.sarl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 54.36.60.51:80;
    listen [2001:41d0:303:4233::1]:80;
    server_name csrs.koba.sarl;
    return 301 https://$host$request_uri;
}
