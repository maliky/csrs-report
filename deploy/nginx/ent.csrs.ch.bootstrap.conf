server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ent.csrs.ch 179.237.107.40 _;

    access_log /var/log/nginx/ent.csrs.ch.access.log;
    error_log /var/log/nginx/ent.csrs.ch.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        default_type "text/plain; charset=utf-8";
        return 200 "Préproduction CSRS en cours de préparation.\n";
    }
}
