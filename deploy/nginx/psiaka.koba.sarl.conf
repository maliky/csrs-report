server {
    listen 54.36.60.51:80;
    listen [2001:41d0:303:4233::1]:80;
    server_name psiaka.koba.sarl;

    access_log /var/log/nginx/psiaka.koba.sarl.access.log;
    error_log /var/log/nginx/psiaka.koba.sarl.error.log;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:18006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
