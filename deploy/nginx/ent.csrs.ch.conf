server {
    listen 80;
    listen [::]:80;
    server_name ent.csrs.ch;

    access_log /var/log/nginx/ent.csrs.ch.access.log;
    error_log /var/log/nginx/ent.csrs.ch.error.log;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:18005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 179.237.107.40 _;
    return 302 https://ent.csrs.ch$request_uri;
}
