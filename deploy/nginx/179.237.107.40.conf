server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 179.237.107.40 _;

    access_log /var/log/nginx/csrs-ip.access.log;
    error_log /var/log/nginx/csrs-ip.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 308 https://179.237.107.40$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 179.237.107.40;

    access_log /var/log/nginx/csrs-ip.access.log;
    error_log /var/log/nginx/csrs-ip.error.log;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/179.237.107.40/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/179.237.107.40/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CSRSIP:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:18005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
