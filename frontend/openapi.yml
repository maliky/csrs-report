components:
  schemas:
    AgendaDirectionEnum:
      enum:
      - programs
      - administration
      type: string
      description: |-
        * `programs` - programs
        * `administration` - administration
    Availability:
      type: object
      properties:
        employee_id:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/AvailabilityKindEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
          default: ''
      required:
      - employee_id
      - end_date
      - kind
      - start_date
    AvailabilityKindEnum:
      enum:
      - leave
      - absence
      - mission
      type: string
      description: |-
        * `leave` - Congé
        * `absence` - Absence
        * `mission` - Mission
    BlankEnum:
      enum:
      - ''
    Cancel:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
      required:
      - reason
      - revision
    CollaboratorReplacement:
      type: object
      properties:
        employee_id:
          type: integer
          minimum: 1
        supervisor_id:
          type: integer
          minimum: 1
      required:
      - employee_id
      - supervisor_id
    CollaboratorUpdate:
      type: object
      properties:
        collaborator_ids:
          type: array
          items:
            type: integer
            minimum: 1
        replacements:
          type: array
          items:
            $ref: '#/components/schemas/CollaboratorReplacement'
        effective_date:
          type: string
          format: date
        state_token:
          type: string
      required:
      - collaborator_ids
      - effective_date
      - state_token
    ConfirmationEnum:
      enum:
      - SUPPRIMER
      type: string
      description: '* `SUPPRIMER` - SUPPRIMER'
    DecisionEnum:
      enum:
      - accept
      - reject
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
    Draft:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        major_events:
          type: string
          default: ''
        revision:
          type: integer
          minimum: 0
          nullable: true
      required:
      - period_end
      - period_start
    Generate:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        agenda_direction:
          $ref: '#/components/schemas/AgendaDirectionEnum'
      required:
      - agenda_direction
      - period_end
      - period_start
    Observation:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        message:
          type: string
      required:
      - message
      - revision
    PatchedAvailabilityUpdate:
      type: object
      properties:
        employee_id:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/AvailabilityKindEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
          default: ''
        revision:
          type: integer
          minimum: 1
    PatchedProposalUpdate:
      type: object
      description: Shared, server-validated assignment schedule.
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        title:
          type: string
          maxLength: 180
        description:
          type: string
        action_id:
          type: integer
          minimum: 1
          nullable: true
        calendar_id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
    PatchedTaskUpdate:
      type: object
      description: Shared, server-validated assignment schedule.
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 180
        description:
          type: string
        action_id:
          type: integer
          minimum: 1
          nullable: true
    PatchedUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        login_alias:
          nullable: true
          oneOf:
          - type: string
            maxLength: 32
            pattern: ^[a-z][a-z0-9_-]*$
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        position:
          type: string
          maxLength: 160
        phone:
          type: string
          maxLength: 32
        agenda_direction:
          oneOf:
          - $ref: '#/components/schemas/AgendaDirectionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        include_in_direction_agendas:
          type: boolean
          default: true
        unit_ids:
          type: array
          items:
            type: integer
            minimum: 1
        primary_unit_id:
          type: integer
          minimum: 1
          nullable: true
        primary_supervisor_id:
          type: integer
          minimum: 1
          nullable: true
        organization_effective_date:
          type: string
          format: date
        state_token:
          type: string
    PlanningPreview:
      type: object
      properties:
        calendar_id:
          type: integer
          minimum: 1
        start_date:
          type: string
          format: date
        source:
          $ref: '#/components/schemas/SourceEnum'
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
      required:
      - calendar_id
      - source
      - start_date
    Progress:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        entry_date:
          type: string
          format: date
        percentage:
          type: integer
          maximum: 100
          minimum: 0
        note:
          type: string
          default: ''
        blocked:
          type: boolean
          default: false
      required:
      - entry_date
      - percentage
      - revision
    ProposalCreate:
      type: object
      description: Shared, server-validated assignment schedule.
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        title:
          type: string
          maxLength: 180
        description:
          type: string
        action_id:
          type: integer
          minimum: 1
          nullable: true
        calendar_id:
          type: integer
          minimum: 1
      required:
      - description
      - due_date
      - estimated_work_days
      - start_date
      - title
    ProposalDecision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        reason:
          type: string
          default: ''
      required:
      - decision
      - revision
    ProposalResubmit:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
      required:
      - revision
    Revision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
      required:
      - revision
    SourceEnum:
      enum:
      - workload
      - due
      type: string
      description: |-
        * `workload` - workload
        * `due` - due
    StateToken:
      type: object
      properties:
        state_token:
          type: string
      required:
      - state_token
    TaskBulkDelete:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/TaskSelection'
        reason:
          type: string
          maxLength: 500
          minLength: 3
        confirmation:
          $ref: '#/components/schemas/ConfirmationEnum'
      required:
      - assignments
      - confirmation
      - reason
    TaskCreate:
      type: object
      description: Shared, server-validated assignment schedule.
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        title:
          type: string
          maxLength: 180
        description:
          type: string
        employee_id:
          type: integer
          minimum: 1
        action_id:
          type: integer
          minimum: 1
          nullable: true
        calendar_id:
          type: integer
          minimum: 1
      required:
      - description
      - due_date
      - employee_id
      - estimated_work_days
      - start_date
      - title
    TaskSelection:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
      required:
      - id
      - revision
    TemporaryPasswordChange:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
        new_password_confirmation:
          type: string
      required:
      - current_password
      - new_password
      - new_password_confirmation
    Transition:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        transition:
          $ref: '#/components/schemas/TransitionEnum'
        reason:
          type: string
          default: ''
      required:
      - revision
      - transition
    TransitionEnum:
      enum:
      - validate
      - reject
      - close_early
      type: string
      description: |-
        * `validate` - validate
        * `reject` - reject
        * `close_early` - close_early
    UserWrite:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        login_alias:
          nullable: true
          oneOf:
          - type: string
            maxLength: 32
            pattern: ^[a-z][a-z0-9_-]*$
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        position:
          type: string
          maxLength: 160
        phone:
          type: string
          maxLength: 32
        agenda_direction:
          oneOf:
          - $ref: '#/components/schemas/AgendaDirectionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        include_in_direction_agendas:
          type: boolean
          default: true
        unit_ids:
          type: array
          items:
            type: integer
            minimum: 1
        primary_unit_id:
          type: integer
          minimum: 1
          nullable: true
        primary_supervisor_id:
          type: integer
          minimum: 1
          nullable: true
        organization_effective_date:
          type: string
          format: date
        state_token:
          type: string
      required:
      - email
      - organization_effective_date
    VisitCreate:
      type: object
      properties:
        party_size:
          type: integer
          maximum: 999
          minimum: 1
        visitor_names:
          type: array
          items:
            type: string
            maxLength: 160
      required:
      - party_size
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
