components:
  schemas:
    ActionEnum:
      enum:
      - submit
      - abandon
      - claim
      - takeover
      - send_to_signature
      - request_correction
      - reject
      - sign
      - complete_distribution
      - complete_fleet
      - place_legal_hold
      - release_legal_hold
      type: string
      description: |-
        * `submit` - submit
        * `abandon` - abandon
        * `claim` - claim
        * `takeover` - takeover
        * `send_to_signature` - send_to_signature
        * `request_correction` - request_correction
        * `reject` - reject
        * `sign` - sign
        * `complete_distribution` - complete_distribution
        * `complete_fleet` - complete_fleet
        * `place_legal_hold` - place_legal_hold
        * `release_legal_hold` - release_legal_hold
    Availability:
      type: object
      properties:
        employee_id:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/AvailabilityKindEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
          default: ''
      required:
      - employee_id
      - end_date
      - kind
      - start_date
    AvailabilityKindEnum:
      enum:
      - leave
      - absence
      - mission
      type: string
      description: |-
        * `leave` - Congé
        * `absence` - Absence
        * `mission` - Mission
    Cancel:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
      required:
      - reason
      - revision
    DecisionEnum:
      enum:
      - accept
      - reject
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
    DocumentUpload:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/DocumentUploadKindEnum'
        file:
          type: string
          format: uri
      required:
      - file
      - kind
      - revision
    DocumentUploadKindEnum:
      enum:
      - terms_of_reference
      - invitation
      - ticket
      - order_draft
      - other
      type: string
      description: |-
        * `terms_of_reference` - Termes de référence
        * `invitation` - Invitation
        * `ticket` - Billet de transport
        * `order_draft` - Projet d'ordre de mission
        * `other` - Autre pièce
