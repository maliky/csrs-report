{% extends "base.html" %}
{% block title %}Connexion — CSRS Report{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Connexion</h1>
  <p>Utilisez votre identifiant court ou l’adresse email enregistrée par le service IT.</p>
  <form method="post" class="stacked-form">
    {% csrf_token %}
    {{ form.as_div }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button button-primary" type="submit">Se connecter</button>
  </form>
</section>
{% endblock %}
